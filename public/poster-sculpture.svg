<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="100%" height="100%" aria-label="Poster Patung Geometris Modular Bauhaus">
  <defs>
    <radialGradient id="softGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#EFE9DC" stop-opacity="0"/>
    </radialGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#242424" flood-opacity="0.12"/>
    </filter>
  </defs>

  <rect width="100%" height="100%" fill="#EFE9DC"/>

  <!-- Subtle ground shadow -->
  <ellipse cx="400" cy="480" rx="220" ry="40" fill="#242424" opacity="0.08"/>

  <!-- Group: Modular Sculpture Composition -->
  <g filter="url(#shadow)">
    <!-- Part 4: Arc / Curve (Decorative or Project 4) in Soft Mint -->
    <path d="M 280 260 C 260 140, 540 140, 520 260 C 500 200, 300 200, 280 260 Z" fill="#B8D8C7" stroke="#242424" stroke-width="3"/>

    <!-- Part 1: Soft Rounded Cube (Project 1) in Cobalt Blue -->
    <rect x="290" y="270" width="180" height="180" rx="28" fill="#2146D9" stroke="#242424" stroke-width="3" transform="rotate(-6 380 360)"/>

    <!-- Part 3: Ring / Torus (Project 3) in Butter Yellow -->
    <path d="M 440 260 A 65 65 0 1 0 440 390 A 65 65 0 1 0 440 260 Z M 440 295 A 30 30 0 1 1 440 355 A 30 30 0 1 1 440 295 Z" fill="#F2D45C" stroke="#242424" stroke-width="3"/>

    <!-- Part 2: Sphere (Project 2) in Tomato Red -->
    <circle cx="330" cy="220" r="55" fill="#D83A2F" stroke="#242424" stroke-width="3"/>
  </g>

  <!-- Accent Geometry Highlights -->
  <circle cx="310" cy="200" r="12" fill="#FFFFFF" opacity="0.4"/>
  <circle cx="510" cy="380" r="8" fill="#EFBFCB" stroke="#242424" stroke-width="2"/>
  <rect x="230" y="340" width="16" height="16" fill="#242424"/>
</svg>
